owner: Cosmos-Factory-Island
repo: huertobio-status

site-name: HuertoBio | Estado del Servicio

status-website:
  cname: status.huerto.bio
  logoUrl: https://raw.githubusercontent.com/Cosmos-Factory-Island/huertobio-status/master/assets/logo.svg
  favicon: https://beta.huerto.bio/favicon.ico
  name: HuertoBio Status
  introTitle: "Estado de los servicios de HuertoBio"
  introMessage: "Monitoreo en tiempo real de la disponibilidad, latencia y rendimiento de nuestras plataformas y APIs."
  theme: light
  navbar:
    - title: Estado
      href: /
    - title: HuertoBio
      href: https://huerto.bio
    - title: App Beta
      href: https://beta.huerto.bio
    - title: GitHub
      href: https://github.com/Cosmos-Factory-Island/huertobio-status
  customCSS: |
    body {
      background-color: #faf8f5 !important;
      color: #1c2a24 !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    nav {
      background-color: #0e241d !important;
      border-bottom: 1px solid #16362c !important;
      padding: 0.75rem 1.5rem !important;
    }
    nav a, nav span {
      color: #f1f5f9 !important;
      font-weight: 600 !important;
    }
    nav a:hover {
      color: #34d399 !important;
    }
    nav img, header img {
      max-height: 36px !important;
      width: auto !important;
      margin-right: 0.75rem !important;
    }
    .card, section, article, .box {
      background-color: #ffffff !important;
      border: 1px solid #e7e3d8 !important;
      border-radius: 16px !important;
      box-shadow: 0 4px 20px -2px rgba(16, 36, 29, 0.05) !important;
      color: #1c2a24 !important;
    }
    h1, h2, h3, h4 {
      color: #0e241d !important;
      font-weight: 700 !important;
    }


# Asignados automáticos al crear issues de incidencias
assignees:
  - kralc

sites:
  - name: App HuertoBio (Beta)
    url: https://beta.huerto.bio
    icon: https://beta.huerto.bio/favicon.ico

  - name: API Backend (Healthcheck)
    url: https://api.huerto.bio/api/health
    expectedStatusCodes:
      - 200

